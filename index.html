<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./book.js" defer></script>
</head>
<body>
    <dialog class="book-modal">
        <h1>Book information</h1>
        <form action="" class="library-form" method="dialog">
            <p>
                <label for="title">Title:</label>
                <input type="text" id="title" name="book-title" />
            </p>
            <p>
                <label for="author">Author:</label>
                <input type="text" id="author" name="book-author" />
            </p>
            <p>
                <label for="pages">Pages:</label>
                <input type="text" id="author" name="book-author" />
            </p>
            <p>
                <label for="pages">Have you read this book?</label>
                <input type="radio">
            </p>
            <button type="submit">Submit</button>
        </form>
    </dialog>
    <div class="header">
        <h1>Library</h1>
        <button class="add-book">New Book</button>
    </div>
    <div class="container">
        
    </div>
</body>
</html>
