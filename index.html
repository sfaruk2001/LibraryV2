<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./book.js" defer></script>
</head>
<body>
    <dialog class="book-modal">
        <h1 class="modal-form-title">Book information</h1>
        <form action="#" class="library-form" method="dialog">
            <label for="title">Title:</label>
            <input type="text" id="title" name="book-title" required/>
        
            <label for="author">Author:</label>
            <input type="text" id="author" name="book-author" required/>
        
            <label for="pages">Pages:</label>
            <input type="text" id="pages" name="book-pages" required/>
        
            <p>Have you read this book?</p>
            <div class="read-wrapper">
                <div class="complete-wrapper">
                    <label for="complete-read">Yes</label>
                    <input type="radio" id="complete-read" name="book-status" value="Complete" required/>
                </div>
                <div class="incomplete-wrapper">
                    <label for="incomplete-read">No</label>
                    <input type="radio" id="incomplete-read" name="book-status" value="Incomplete" />
                </div>
            </div>
        
            <button type="submit" class="submit-button">Submit</button>
        </form>
    </dialog>
    <div class="header">
        <h1>Library</h1>
        <button class="add-book">New Book</button>
    </div>
    <div class="container">
        
    </div>
</body>
</html>
